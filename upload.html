<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload to Gallery - FrameDosti</title>
  <style>
    body { font-family: system-ui, Arial; background: #0f172a; color: #fff; padding: 2rem }
    .card { background: #111827; padding: 1rem; border-radius: 8px; max-width: 640px; margin: 0 auto }
    input[type=file] { color: #fff }
    .preview img { max-width: 100%; border-radius: 6px }
    .btn { background: #06b6d4; border: none; padding: .75rem 1rem; border-radius: 6px; color: #042; font-weight: 600; cursor: pointer }
    .status { margin-top: .5rem }
  </style>
</head>
<body>
  <div class="card">
    <h2>Upload Photo (Gallery)</h2>
    <p>Choose an image, upload to temporary storage, server will validate and move it to the gallery.</p>

    <div>
      <label>Image: <input id="file" type="file" accept="image/*"></label>
    </div>
    <div>
      <label>Caption: <input id="caption" type="text" placeholder="Short caption"></label>
    </div>
    <div style="margin-top:.5rem">
      <button id="uploadBtn" class="btn">Upload</button>
    </div>

    <div class="status" id="status"></div>
    <div class="preview" id="preview"></div>
  </div>

  <script type="module" src="client/upload-ui.js"></script>
</body>
</html>
